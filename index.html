<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --gutter: 16px; --gap: 12px; --r-lg: 22px; --r-md: 16px; --r-sm: 11px;
  --pairs: #3987e5; --gym: #d95926; --study: #199e70; --todo: #c98500; --sleep: rgba(135, 140, 255, .42);
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.22, 1.28, .36, 1);
  --safe-top: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
  --safe-bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
}
[data-theme="dark"] {
  color-scheme: dark;
  --sheet: #0d0f17; --sheet-2: #12141f; --card: linear-gradient(160deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .035)); --card-2: rgba(255, 255, 255, .1);
  --line: rgba(255, 255, 255, .09); --ink: #f3f2ee; --ink-2: #b9bcc6; --ink-3: #868b99;
  --track: rgba(255, 255, 255, .1); --good: #3fcf9a; --warn: #eda100; --bad: #ef7f7e; --cell: rgba(255, 255, 255, .08);
  --lift: inset 0 1px 0 rgba(255, 255, 255, .08), 0 10px 26px rgba(0, 0, 0, .34), 0 2px 6px rgba(0, 0, 0, .3);
  --plate: radial-gradient(circle at 38% 30%, #2a2e3f, #151823 62%, #0c0e16);
}
[data-theme="light"] {
  color-scheme: light;
  --sheet: #f6f5f1; --sheet-2: #ecebe5; --card: linear-gradient(160deg, #fff, #fbfaf7); --card-2: rgba(20, 20, 10, .06);
  --line: rgba(20, 20, 10, .08); --ink: #101114; --ink-2: #52514e; --ink-3: #6f6e69;
  --track: rgba(20, 20, 10, .09); --good: #0f8a5f; --warn: #a86f00; --bad: #c93534; --cell: rgba(20, 20, 10, .07);
  --pairs: #2a78d6; --gym: #eb6834; --study: #1baf7a; --todo: #eda100; --sleep: rgba(85, 90, 210, .4);
  --lift: inset 0 1px 0 #fff, 0 10px 24px rgba(40, 40, 60, .1), 0 2px 5px rgba(40, 40, 60, .07);
  --plate: radial-gradient(circle at 38% 30%, #fff, #f0efe9 62%, #dedcd3);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: #0a0d1c; overflow-x: hidden; }
body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* Живое небо: слои двигаются на разной глубине */
#sky, #land, #orb, #fx { position: fixed; pointer-events: none; }
#sky, #land, #fx { inset: 0; width: 100%; height: 100%; }
#sky { z-index: 0; } #orb { z-index: 1; left: 0; top: 0; width: 200px; height: 200px; will-change: transform; } #land { z-index: 2; } #fx { z-index: 3; }
.twinkle { animation: twinkle 3.6s ease-in-out infinite alternate; }
.twinkle:nth-child(2) { animation-delay: 1.2s; animation-duration: 4.6s; } .twinkle:nth-child(3) { animation-delay: 2.1s; animation-duration: 5.4s; }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
.cloud { animation: drift 70s linear infinite alternate; }
@keyframes drift { to { transform: translateX(90px); } }
.lamp { fill: #ffd98a; animation: twinkle 2.8s ease-in-out infinite alternate; }
.hill { transition: fill 1.2s linear; }
.meteor { stroke: #fff; stroke-width: 1.4; stroke-linecap: round; }

/* Шапка над шторкой */
main { position: relative; z-index: 4; }
#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.top { color: #fff; padding: calc(var(--safe-top) + 16px) var(--gutter) var(--gutter); display: flex; flex-direction: column; justify-content: flex-end; text-shadow: 0 1px 12px rgba(0, 0, 0, .4); will-change: transform, opacity; }
.top.home { min-height: 52vh; justify-content: space-between; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.clock { font-size: 60px; line-height: 1; font-weight: 700; letter-spacing: -.035em; }
.clock i { font-style: normal; animation: tick 2s steps(2) infinite; }
@keyframes tick { 50% { opacity: .45; } }
.date { font-size: 15px; margin-top: 4px; opacity: .92; }
.date::first-letter { text-transform: uppercase; }
.top h1 { font-size: 31px; line-height: 1.1; font-weight: 750; letter-spacing: -.02em; }
.top p { font-size: 14px; margin-top: 3px; opacity: .9; }
.wx { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 11px 7px 8px; border-radius: 16px; background: rgba(8, 12, 30, .3); border: 1px solid rgba(255, 255, 255, .15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-align: left; text-shadow: none; animation: rise .5s var(--ease) both; }
.wx svg { width: 28px; height: 28px; }
.wx b { display: block; font-size: 16px; font-weight: 650; line-height: 1.1; }
.wx span { font-size: 11.5px; opacity: .85; }

/* Главная карточка */
.hero { position: relative; margin-top: var(--gap); padding: 14px 15px; border-radius: var(--r-lg); color: #fff; background: linear-gradient(150deg, rgba(255, 255, 255, .2), rgba(8, 12, 30, .34)); border: 1px solid rgba(255, 255, 255, .2); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); box-shadow: 0 16px 34px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .28); text-shadow: none; overflow: hidden; transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s var(--ease); animation: float-in .7s var(--spring) both; }
@keyframes float-in { from { opacity: 0; transform: perspective(700px) rotateX(14deg) translateY(26px); } }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(180px circle at var(--sx, 30%) var(--sy, 0%), rgba(255, 255, 255, .2), transparent 70%); }
.hero small { display: block; font-size: 12.5px; opacity: .9; }
.hero b { display: block; font-size: 19px; font-weight: 680; line-height: 1.22; margin-top: 1px; letter-spacing: -.01em; }
.hero p { font-size: 13px; opacity: .88; margin-top: 2px; }
.hero .hb { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .22); margin-top: 10px; overflow: hidden; }
.hero .hb i { display: block; height: 100%; border-radius: 3px; background: #fff; box-shadow: 0 0 10px #fff; transition: width 1s linear; }
.hrow { display: flex; align-items: flex-end; gap: 10px; }
.hrow > div { flex: 1; min-width: 0; }
.btn3d { flex: none; position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 14px; background: linear-gradient(180deg, #2fd39a, #149a6c); color: #fff; font-size: 14px; font-weight: 650; box-shadow: 0 4px 0 #0c6a4a, 0 10px 18px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .45); transition: transform .12s, box-shadow .12s; }
.btn3d:active { transform: translateY(3px); box-shadow: 0 1px 0 #0c6a4a, 0 3px 8px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .45); }
.btn3d.quiet { background: linear-gradient(180deg, rgba(255, 255, 255, .24), rgba(255, 255, 255, .12)); box-shadow: 0 4px 0 rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .3); }
.btn3d svg { width: 16px; height: 16px; fill: currentColor; }

/* Шторка */
.sheet { position: relative; background: linear-gradient(180deg, var(--sheet-2), var(--sheet) 220px); border-radius: 26px 26px 0 0; padding: 10px var(--gutter) calc(112px + var(--safe-bottom)); min-height: 60vh; flex: 1; box-shadow: 0 -16px 40px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .1); animation: lift .6s var(--spring) both; }
@keyframes lift { from { transform: translateY(60px); opacity: .3; } }
.moved .sheet { animation: none; }
.grip { width: 38px; height: 4px; border-radius: 2px; background: var(--track); margin: 0 auto 12px; }
.sec { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--ink-3); margin: 18px 2px 8px; }
.sec:first-of-type { margin-top: 4px; }
.sec button { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.card { position: relative; background: var(--card); border-radius: var(--r-lg); padding: var(--gutter); margin-bottom: var(--gap); box-shadow: var(--lift); }
.sheet > *:not(.grip) { animation: slide .5s var(--spring) both; }
.sheet > *:nth-child(3) { animation-delay: .04s; } .sheet > *:nth-child(4) { animation-delay: .08s; } .sheet > *:nth-child(5) { animation-delay: .12s; } .sheet > *:nth-child(6) { animation-delay: .16s; } .sheet > *:nth-child(n+7) { animation-delay: .2s; }
@keyframes slide { from { opacity: 0; transform: translate3d(calc(var(--dir, 0) * 34px), 16px, 0) scale(.98); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; padding-bottom: 0; } .row:first-child { padding-top: 0; }
.row .v { color: var(--ink-2); flex: none; font-size: 14px; }
.hint { font-size: 13px; color: var(--ink-2); }
.empty { text-align: center; color: var(--ink-2); padding: 18px 8px; }
.empty svg { width: 76px; height: 76px; margin: 0 auto 8px; }
.empty b { display: block; color: var(--ink); font-weight: 650; }

/* Кольцо дня: циферблат с объёмом */
.dial { position: relative; width: 248px; height: 248px; margin: 2px auto 8px; }
.dial .plate { position: absolute; inset: 44px; border-radius: 50%; background: var(--plate); box-shadow: 0 12px 24px rgba(0, 0, 0, .38), inset 0 1px 1px rgba(255, 255, 255, .16), inset 0 -6px 12px rgba(0, 0, 0, .2); }
.dial .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.dial .c b { font-size: 42px; line-height: 1; font-weight: 750; letter-spacing: -.02em; }
.dial .c span { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.arc { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.lab { fill: var(--ink-3); font-size: 10.5px; }
.tickm { stroke: var(--ink-3); stroke-width: 1; opacity: .4; }
.nowd { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .25; } }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }

/* Плитки */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: var(--gap); }
.tile { position: relative; background: var(--card); border-radius: var(--r-md); padding: 10px 4px 9px; text-align: center; box-shadow: var(--lift); transition: transform .18s var(--spring); }
.tile:active { transform: scale(.94) translateY(1px); }
.mini { position: relative; width: 46px; height: 46px; margin: 0 auto 4px; }
.mini b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.tile span { display: block; font-size: 11.5px; color: var(--ink-2); line-height: 1.15; }
.pr { fill: none; stroke-linecap: round; animation: draw-to .9s var(--ease) both; }
@keyframes draw-to { from { stroke-dashoffset: var(--p); } }

/* Главное сегодня */
.todo { display: flex; gap: 11px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.todo:first-child { padding-top: 0; } .todo:last-child { border-bottom: 0; padding-bottom: 0; }
.todo .x { flex: 1; min-width: 0; }
.rank { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--card-2); color: var(--ink-2); }
.play { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); transition: transform .15s var(--spring); }
.play:active { transform: scale(.85); }
.play svg { width: 13px; height: 13px; fill: var(--ink); }

/* Лента дня */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: var(--gap); }
.strip button { position: relative; padding: 7px 0 7px; border-radius: var(--r-sm); text-align: center; font-size: 12px; color: var(--ink-2); transition: background .25s, transform .2s var(--spring); }
.strip button:active { transform: scale(.92); }
.strip b { display: block; font-size: 17px; font-weight: 650; color: var(--ink); line-height: 1.2; }
.strip em { display: block; width: 22px; height: 4px; border-radius: 2px; margin: 4px auto 0; background: var(--track); overflow: hidden; }
.strip em i { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; }
.strip .on { background: var(--card-2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
.ribbon { position: relative; border-radius: var(--r-lg); overflow: hidden; color: #fff; box-shadow: var(--lift), inset 0 0 0 1px rgba(255, 255, 255, .08); }
.hr { position: absolute; left: 12px; font-size: 11.5px; opacity: .8; transform: translateY(-50%); }
.hl { position: absolute; left: 44px; right: 0; height: 1px; background: rgba(255, 255, 255, .12); }
.chip { position: absolute; left: 44px; right: 10px; border-radius: var(--r-sm); padding: 5px 10px 5px 13px; background: linear-gradient(135deg, rgba(10, 14, 34, .72), rgba(10, 14, 34, .5)); border: 1px solid rgba(255, 255, 255, .2); box-shadow: 0 6px 14px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .16); overflow: hidden; animation: slide .5s var(--spring) both; text-align: left; }
.chip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); box-shadow: 0 0 10px var(--c); }
.chip b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip span { font-size: 11.5px; opacity: .85; white-space: nowrap; }
.free { position: absolute; left: 44px; right: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; color: #fff; opacity: .78; border-radius: var(--r-sm); transition: background .2s; }
.free:active { background: rgba(255, 255, 255, .12); }
.free i { font-style: normal; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .6); line-height: 1; }
.rest { position: absolute; left: 44px; right: 10px; display: grid; place-items: center; font-size: 11.5px; border-radius: var(--r-sm); background: rgba(255, 255, 255, .06); }
.rest.deep { background: rgba(120, 130, 255, .22); border-radius: var(--r-sm) var(--r-sm) 0 0; }
.sunm { position: absolute; left: 44px; right: 0; height: 0; border-top: 1px dashed rgba(255, 224, 150, .6); }
.sunm span { position: absolute; right: 12px; top: -15px; font-size: 10.5px; color: #ffe6ad; }
.now { position: absolute; left: 0; right: 0; height: 2px; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .8); z-index: 2; }
.now span { position: absolute; left: 6px; top: -10px; background: #fff; color: #101114; font-size: 11.5px; font-weight: 650; padding: 1px 6px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.allday { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: var(--r-sm); background: var(--card); box-shadow: var(--lift); font-size: 13.5px; margin-bottom: 8px; }

/* Цели */
.goal { display: block; width: 100%; text-align: left; }
.ghead { display: flex; gap: 12px; align-items: center; }
.ghead > div:last-child { flex: 1; min-width: 0; }
.goal .t { font-size: 17px; font-weight: 650; line-height: 1.25; letter-spacing: -.01em; }
.goal .s { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.gorb { flex: none; position: relative; border-radius: 50%; box-shadow: 0 10px 18px rgba(0, 0, 0, .36); }
.wave { animation: wave 5s linear infinite; }
.wave.b { animation-duration: 8s; animation-direction: reverse; }
@keyframes wave { to { transform: translateX(-80px); } }
.gorb b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 750; color: #fff; text-shadow: 0 1px 5px rgba(0, 0, 0, .55); }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 12px 0 4px; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #1baf7a, #6fe3b4); transform-origin: left; animation: fill 1s var(--ease) both; }
@keyframes fill { from { transform: scaleX(0); } }
.pct { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.step { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; margin-top: 2px; }
.step .d { margin-left: auto; font-size: 12.5px; color: var(--ink-2); flex: none; text-align: right; }
.line-btn { display: block; width: 100%; margin-top: 8px; padding: 8px 0 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); text-align: left; }

/* Отметки: кнопка продавливается, как настоящая */
.box { width: 28px; height: 28px; border-radius: 10px; border: 2px solid var(--ink-3); flex: none; display: grid; place-items: center; box-shadow: 0 2px 0 rgba(0, 0, 0, .28); transition: background .2s, border-color .2s, transform .18s var(--spring), box-shadow .18s; }
.box:active { transform: translateY(2px) scale(.92); box-shadow: 0 0 0 rgba(0, 0, 0, .28); }
.box svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.box path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .28s ease; }
.box.on { background: linear-gradient(180deg, #2fd39a, #149a6c); border-color: #149a6c; box-shadow: 0 2px 0 #0c6a4a, 0 0 14px rgba(47, 211, 154, .5); }
.box.on path { stroke-dashoffset: 0; }

/* Задачи */
.tgroup { font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 12px 0 2px; }
.tgroup:first-child { padding-top: 0; }
.tgroup.bad { color: var(--bad); }
.twrap { position: relative; overflow: hidden; max-height: 170px; transition: max-height .35s .1s, opacity .3s; }
.twrap.gone { max-height: 0; opacity: 0; }
.tback { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 8px; color: var(--good); font-size: 13px; font-weight: 600; opacity: 0; }
.task { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); background: transparent; touch-action: pan-y; }
.twrap:last-child .task { border-bottom: 0; padding-bottom: 2px; }
.task .x { flex: 1; min-width: 0; }
.due { display: inline-block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.due.warn { color: var(--warn); } .due.bad { color: var(--bad); }

/* Режим */
.habit { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.habit:first-child { padding-top: 0; } .habit:last-child { border-bottom: 0; padding-bottom: 0; }
.habit b { font-weight: 650; display: block; }
.flame { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; fill: #f4a23d; animation: flick 1.4s ease-in-out infinite alternate; transform-origin: 50% 90%; }
@keyframes flick { to { transform: scale(1.14, .94) rotate(3deg); } }
.cells { display: grid; grid-template-columns: repeat(7, 11px); gap: 3px; }
.cells i { aspect-ratio: 1; border-radius: 3px; background: var(--cell); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .18); animation: pop .3s ease both; }
.cells i.on { background: linear-gradient(180deg, #2fd39a, #149a6c); }
.cells i.today { outline: 1.5px solid var(--ink-2); outline-offset: 1px; }
@keyframes pop { from { transform: scale(0); } }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.pill { flex: none; padding: 7px 12px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); font-size: 13px; transition: transform .18s var(--spring); }
.pill:active { transform: scale(.93); }
.pill.on { background: var(--ink); color: #0d0f16; }
[data-theme="light"] .pill.on { color: #fff; }
.starts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.line { fill: none; stroke: var(--gym); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease forwards; }
.area { animation: rise .8s .3s ease both; }
.pt { fill: var(--gym); stroke: var(--sheet); stroke-width: 2; animation: pop .3s ease both; transform-box: fill-box; transform-origin: center; }
.hit { fill: transparent; cursor: pointer; }
.grid { stroke: var(--line); stroke-width: 1; }
.val { fill: var(--ink); font-size: 12px; font-weight: 650; }

      gaps += `<button class="free" data-free="${t}" style="top:${y(cursor)}px;height:${n * PX}px"><i>+</i>свободно ${dur(n * 60)}</button>`;
    }

  });
  const chips = list.map((x, i) => {
    const a = hourOf(x.start), b = hourOf(x.end) || 24, h = Math.max(36, (b - a) * PX - 3);
    return `<button class="chip" style="top:${y(a)}px;height:${h}px;--c:var(--${COL[x.cal] || 'todo'});animation-delay:${i * 40}ms" data-tip="${esc(hm(x.start) + '–' + hm(x.end) + ' ' + x.title + (x.place ? ', ' + x.place : '') + (x.note ? '. ' + x.note : ''))}"><b>${esc(x.title)}</b><span class="num">${hm(x.start)}–${hm(x.end)}${x.note ? ' · ' + esc(x.note) : ''}</span></button>`;

  const nowH = hourOf(NOW()), now = today && nowH >= from ? `<div class="now" style="top:${y(nowH)}px"><span class="num">${hm(NOW())}</span></div>` : '';
  const rest = `<div class="rest" style="top:${y(mute)}px;height:${(bed - mute) * PX}px">спокойный вечер</div><div class="rest deep" style="top:${y(bed)}px;height:${(to - bed) * PX}px">сон с ${dash.sleep.bed}, подъём в ${dash.sleep.wake}</div>`;
  return `<div class="ribbon" style="height:${H}px;background:linear-gradient(180deg,${stops.join(',')})">${hrs}${mark(sun.rise, 'восход')}${mark(sun.set, 'закат')}${gaps}${rest}${chips}${now}</div>`;
}
