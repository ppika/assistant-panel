<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --gutter: 16px; --gap: 12px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --pairs: #3987e5; --gym: #d95926; --study: #199e70; --todo: #c98500;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
[data-theme="dark"] {
  color-scheme: dark;
  --sheet: rgba(13, 15, 22, .86); --card: rgba(255, 255, 255, .06); --card-2: rgba(255, 255, 255, .1);
  --line: rgba(255, 255, 255, .09); --ink: #f3f2ee; --ink-2: #b9bcc6; --ink-3: #868b99;
  --track: rgba(255, 255, 255, .1); --good: #3fcf9a; --warn: #eda100; --bad: #ef7f7e; --cell: rgba(255, 255, 255, .08);
}
[data-theme="light"] {
  color-scheme: light;
  --sheet: rgba(250, 250, 247, .9); --card: rgba(255, 255, 255, .8); --card-2: rgba(20, 20, 10, .06);
  --line: rgba(20, 20, 10, .09); --ink: #101114; --ink-2: #52514e; --ink-3: #6f6e69;
  --track: rgba(20, 20, 10, .09); --good: #0f8a5f; --warn: #a86f00; --bad: #c93534; --cell: rgba(20, 20, 10, .07);
  --pairs: #2a78d6; --gym: #eb6834; --study: #1baf7a; --todo: #eda100;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: #0a0d1c; overflow-x: hidden; }
body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; color: var(--ink); user-select: none; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* Живое небо: один фон на все экраны */
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.hill { transition: fill 1.2s linear; will-change: transform; }
.star { fill: #fff; animation: twinkle 3.4s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
.halo { animation: breathe 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes breathe { to { transform: scale(1.16); opacity: .7; } }
.cloud { fill: #fff; animation: drift 44s linear infinite alternate; }
@keyframes drift { to { transform: translateX(70px); } }

/* Шапка над шторкой */
main { position: relative; z-index: 1; }
#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.top { color: #fff; padding: calc(max(16px, env(safe-area-inset-top)) + 4px) var(--gutter) var(--gutter); display: flex; flex-direction: column; justify-content: flex-end; text-shadow: 0 1px 12px rgba(0, 0, 0, .35); }
.top.home { min-height: 46vh; justify-content: space-between; }
.clock { font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -.03em; }
.date { font-size: 15px; margin-top: 4px; opacity: .92; }
.date::first-letter { text-transform: uppercase; }
.top h1 { font-size: 30px; line-height: 1.1; font-weight: 750; letter-spacing: -.02em; }
.top p { font-size: 14px; margin-top: 3px; opacity: .9; }
.glass { margin-top: var(--gap); padding: 11px 14px; border-radius: var(--r-md); background: rgba(8, 12, 30, .34); border: 1px solid rgba(255, 255, 255, .16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); text-shadow: none; }
.glass small { display: block; font-size: 12.5px; opacity: .85; }
.glass b { display: block; font-size: 16px; font-weight: 650; line-height: 1.25; }

/* Шторка */
.sheet { background: var(--sheet); backdrop-filter: blur(26px) saturate(1.4); -webkit-backdrop-filter: blur(26px) saturate(1.4); border-radius: 24px 24px 0 0; padding: 10px var(--gutter) calc(96px + env(safe-area-inset-bottom)); min-height: 62vh; flex: 1; animation: lift .55s var(--ease) both; border-top: 1px solid var(--line); }
@keyframes lift { from { transform: translateY(40px); opacity: .4; } }
.grip { width: 36px; height: 4px; border-radius: 2px; background: var(--track); margin: 0 auto 12px; }
.sec { font-size: 13px; font-weight: 600; color: var(--ink-3); margin: 18px 2px 8px; }
.sec:first-of-type { margin-top: 4px; }
.card { background: var(--card); border-radius: var(--r-lg); padding: var(--gutter); margin-bottom: var(--gap); border: 1px solid var(--line); }
.sheet > * { animation: rise .45s var(--ease) both; }
.sheet > *:nth-child(3) { animation-delay: .05s; } .sheet > *:nth-child(4) { animation-delay: .1s; } .sheet > *:nth-child(5) { animation-delay: .15s; } .sheet > *:nth-child(6) { animation-delay: .2s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; padding-bottom: 0; } .row:first-child { padding-top: 0; }
.row .v { color: var(--ink-2); flex: none; font-size: 14px; }
.hint { font-size: 13px; color: var(--ink-2); }
.empty { text-align: center; color: var(--ink-2); padding: 20px 8px; }

/* Кольцо дня */
.dial { position: relative; width: 236px; height: 236px; margin: 2px auto 6px; }
.dial .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.dial .c b { font-size: 40px; line-height: 1; font-weight: 750; letter-spacing: -.02em; }
.dial .c span { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.arc { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.lab { fill: var(--ink-3); font-size: 10.5px; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }

/* Плитки */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); margin-bottom: var(--gap); }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; text-align: left; transition: transform .15s; }
.tile:active { transform: scale(.96); }
.tile b { display: block; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.tile span { font-size: 12.5px; color: var(--ink-2); }

/* Лента дня */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: var(--gap); }
.strip button { padding: 7px 0 6px; border-radius: var(--r-sm); text-align: center; font-size: 12px; color: var(--ink-2); transition: background .2s; }
.strip b { display: block; font-size: 17px; font-weight: 650; color: var(--ink); line-height: 1.2; }
.strip em { display: block; width: 4px; height: 4px; border-radius: 50%; margin: 3px auto 0; background: transparent; }
.strip .has em { background: var(--ink-3); }
.strip .on { background: var(--card-2); }
.ribbon { position: relative; border-radius: var(--r-lg); overflow: hidden; color: #fff; }
.hr { position: absolute; left: 12px; font-size: 11.5px; opacity: .78; transform: translateY(-50%); }
.hl { position: absolute; left: 44px; right: 0; height: 1px; background: rgba(255, 255, 255, .12); }
.chip { position: absolute; left: 44px; right: 10px; border-radius: var(--r-sm); padding: 5px 10px 5px 12px; background: rgba(8, 12, 30, .4); border: 1px solid rgba(255, 255, 255, .2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overflow: hidden; animation: rise .45s var(--ease) both; }
.chip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.chip b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip span { font-size: 11.5px; opacity: .85; white-space: nowrap; }
.free { position: absolute; left: 44px; right: 10px; display: grid; place-items: center; font-size: 11.5px; opacity: .7; }
.now { position: absolute; left: 0; right: 0; height: 2px; background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, .7); z-index: 2; }
.now span { position: absolute; left: 6px; top: -10px; background: #fff; color: #101114; font-size: 11.5px; font-weight: 650; padding: 1px 6px; border-radius: 8px; }
.allday { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--line); font-size: 13.5px; margin-bottom: 8px; }

/* Цели */
.goal .t { font-size: 17px; font-weight: 650; line-height: 1.25; }
.goal .s { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 12px 0 4px; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #1baf7a, #6fe3b4); transform-origin: left; animation: fill 1s var(--ease) both; }
@keyframes fill { from { transform: scaleX(0); } }
.pct { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.step { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; margin-top: 2px; }
.step .d { margin-left: auto; font-size: 12.5px; color: var(--ink-2); flex: none; }
.step.done { color: var(--ink-3); text-decoration: line-through; }

/* Отметки */
.box { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--ink-3); flex: none; display: grid; place-items: center; transition: background .2s, border-color .2s, transform .15s; }
.box:active { transform: scale(.88); }
.box svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.box path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .28s ease; }
.box.on { background: var(--study); border-color: var(--study); }
.box.on path { stroke-dashoffset: 0; }

/* Задачи */
.task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); overflow: hidden; max-height: 150px; transition: opacity .35s, transform .35s, max-height .35s .1s, padding .35s .1s; }
.task:first-child { padding-top: 0; } .task:last-child { border-bottom: 0; padding-bottom: 0; }
.task.gone { opacity: 0; transform: translateX(40px); max-height: 0; padding: 0; }
.due { display: inline-block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.due.warn { color: var(--warn); } .due.bad { color: var(--bad); }

/* Режим */
.habit { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.habit:first-child { padding-top: 0; } .habit:last-child { border-bottom: 0; padding-bottom: 0; }
.habit b { font-weight: 650; display: block; }
.cells { display: grid; grid-template-columns: repeat(7, 11px); gap: 3px; }
.cells i { aspect-ratio: 1; border-radius: 3px; background: var(--cell); animation: pop .3s ease both; }
.cells i.on { background: #1baf7a; }
.cells i.today { outline: 1.5px solid var(--ink-2); outline-offset: 1px; }
@keyframes pop { from { transform: scale(0); } }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.pill { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); font-size: 13px; }
.pill.on { background: var(--ink); color: #0d0f16; }
[data-theme="light"] .pill.on { color: #fff; }
.line { fill: none; stroke: var(--gym); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease forwards; }
.pt { fill: var(--gym); stroke: var(--sheet); stroke-width: 2; animation: pop .3s ease both; transform-box: fill-box; transform-origin: center; }
.hit { fill: transparent; cursor: pointer; }
.grid { stroke: var(--line); stroke-width: 1; }
.val { fill: var(--ink); font-size: 12px; font-weight: 650; }

/* Меню */
nav { position: fixed; z-index: 5; left: var(--gutter); right: var(--gutter); bottom: calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); padding: 5px; border-radius: 22px; background: rgba(12, 14, 22, .72); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
#pill { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 5); border-radius: 17px; background: rgba(255, 255, 255, .14); transition: transform .32s cubic-bezier(.3, 1.3, .5, 1); }
nav button { position: relative; display: grid; justify-items: center; gap: 1px; padding: 6px 0 4px; font-size: 11px; color: rgba(255, 255, 255, .62); transition: color .2s; }
nav button.on { color: #fff; }
nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* Обновление данных без повторной анимации экрана */
.still * { animation: none !important; }
.still .arc, .still .line { stroke-dashoffset: 0; }

/* Служебное */
.boot { position: fixed; inset: auto 0 0 0; height: 58vh; border-radius: 24px 24px 0 0; background: var(--sheet); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px); z-index: 1; padding: 20px var(--gutter); }
.ph { height: 84px; border-radius: var(--r-lg); margin-bottom: var(--gap); background: linear-gradient(100deg, var(--card) 30%, var(--card-2) 50%, var(--card) 70%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
#tip { position: fixed; z-index: 20; max-width: 230px; padding: 7px 10px; border-radius: var(--r-sm); background: var(--ink); color: #0d0f16; font-size: 12.5px; line-height: 1.3; pointer-events: none; opacity: 0; transition: opacity .15s; }
[data-theme="light"] #tip { color: #fff; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 390 844" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop id="s0" offset="0"/><stop id="s1" offset=".32"/><stop id="s2" offset=".52"/></linearGradient>
    <radialGradient id="sunG"><stop offset="0" stop-color="#fff2b0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="moonG"><stop offset="0" stop-color="#dfe3ff" stop-opacity=".55"/><stop offset="1" stop-color="#dfe3ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="390" height="844" fill="url(#skyG)"/>
  <g id="stars"></g>
  <g id="clouds"><g class="cloud"><ellipse cx="80" cy="96" rx="34" ry="9"/><ellipse cx="100" cy="88" rx="20" ry="11"/></g><g class="cloud" style="animation-duration:60s"><ellipse cx="282" cy="62" rx="26" ry="7"/><ellipse cx="298" cy="56" rx="14" ry="8"/></g></g>
  <g id="body"></g>
  <path class="hill" id="h0" d="M0 262 Q90 214 180 256 T390 236 V844 H0z"/>

</svg>
<main id="app"></main>
<div class="boot" id="boot"><div class="ph"></div><div class="ph"></div><div class="ph"></div></div>
<nav id="nav" aria-label="Разделы"></nav>

<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbyX2ebkofpr7zYKAuW8E8ocerWxyxAXyTNbvrtbhtxTHpqK6Tk4OKRT2SuoH3iAoJ8ILQ/exec?api=1';
const TZ = 'Europe/Moscow', LAT = 56.33, LON = 44.0;
const qs = new URLSearchParams(location.search), demo = qs.has('demo');
const tg = window.Telegram && window.Telegram.WebApp;
const fakeHour = qs.has('h') ? +qs.get('h') : null;
const COL = { 'Пары': 'pairs', 'Зал': 'gym', 'Учёба дома': 'study', 'Дела': 'todo' };
const NAMES = { 'Пары': 'Пары', 'Зал': 'Зал', 'Учёба дома': 'Учёба', 'Дела': 'Дела' };
const TABS = [
  ['today', 'Сегодня', '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'],
  ['day', 'День', '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ['goals', 'Цели', '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>'],
  ['tasks', 'Задачи', '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/>'],
  ['mode', 'Режим', '<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>']
];
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 13l4.5 4.5L19 7"/></svg>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (ms, o) => new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, ...o }).format(ms);
const hm = ms => fmt(ms, { hour: '2-digit', minute: '2-digit' });
const iso = ms => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms);
const dayMs = d => Date.parse(d + 'T12:00:00+03:00');
const shift = (d, n) => iso(dayMs(d) + n * 864e5);
const hourOf = ms => { const p = fmt(ms, { hour: 'numeric', minute: 'numeric', hour12: false }).split(':'); return (+p[0] % 24) + +p[1] / 60; };
const NOW = () => fakeHour === null ? Date.now() : Date.parse(iso(Date.now()) + 'T00:00:00+03:00') + fakeHour * 36e5;
const haptic = t => { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
let dash = null, tab = 'today', selDay = null, selEx = 0, pillAt = 0;

/* ---------- Солнце: настоящее положение для Нижнего Новгорода ---------- */
const RAD = Math.PI / 180;
function solarBase(ms) {
  const J = ms / 864e5 + 2440587.5 - 2451545, M = (357.5291 + .98560028 * J) * RAD;
  const C = (1.9148 * Math.sin(M) + .02 * Math.sin(2 * M) + .0003 * Math.sin(3 * M)) * RAD, L = M + C + 102.9372 * RAD + Math.PI;
  return { J, M, L, dec: Math.asin(Math.sin(L) * Math.sin(23.4397 * RAD)) };
}
function sunTimes(ms) {
  const b = solarBase(ms), n = Math.round(b.J - .0009 + LON / 360);
  const Jt = 2451545 + .0009 - LON / 360 + n + .0053 * Math.sin(b.M) - .0069 * Math.sin(2 * b.L);
  const at = h => {
    const c = (Math.sin(h * RAD) - Math.sin(LAT * RAD) * Math.sin(b.dec)) / (Math.cos(LAT * RAD) * Math.cos(b.dec));
    const w = Math.acos(Math.max(-1, Math.min(1, c))) / (2 * Math.PI);
    return [(Jt - w - 2440587.5) * 864e5, (Jt + w - 2440587.5) * 864e5];
  };
  const d = at(-.833);
  return { rise: d[0], set: d[1] };
}
function altitude(ms) {
  const b = solarBase(ms), lw = -LON * RAD, theta = (280.16 + 360.9856235 * b.J) * RAD - lw;
  const ra = Math.atan2(Math.sin(b.L) * Math.cos(23.4397 * RAD), Math.cos(b.L));
  const H = theta - ra;
  return Math.asin(Math.sin(LAT * RAD) * Math.sin(b.dec) + Math.cos(LAT * RAD) * Math.cos(b.dec) * Math.cos(H)) / RAD;
}
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const SKY = { night: ['#060a20', '#111a44', '#232c5c'], dawn: ['#2c3f8f', '#c9708a', '#ffc08a'], dusk: ['#1b1d58', '#7d3b86', '#ee8355'], day: ['#1c69d3', '#3b95ea', '#a3d8f7'] };
const LAND = { night: ['#1a2150', '#141a40', '#0e1330', '#090c20'], dawn: ['#b0668a', '#7f4a84', '#553a78', '#2c2250'], dusk: ['#8c4a7a', '#5f3570', '#3f2860', '#20163c'], day: ['#7fb8d8', '#4f9a8a', '#2f7f62', '#175038'] };
function tint(set, alt, pm) {
  const tw = pm ? set.dusk : set.dawn;
  if (alt <= -10) return set.night;

const skyAt = (ms, sun) => tint(SKY, altitude(ms), ms > (sun.rise + sun.set) / 2);
function paintSky() {
  const ms = NOW(), sun = sunTimes(ms), alt = altitude(ms), pm = ms > (sun.rise + sun.set) / 2;
  const c = tint(SKY, alt, pm), land = tint(LAND, alt, pm);
  c.forEach((v, i) => document.getElementById('s' + i).setAttribute('stop-color', v));
  land.forEach((v, i) => document.getElementById('h' + i).setAttribute('fill', v));

  const isDay = ms >= sun.rise && ms <= sun.set;
  const prevSet = sunTimes(sun.rise - 864e5 * .5).set, nextRise = sunTimes(sun.set + 864e5 * .5).rise;
  const from = isDay ? sun.rise : ms < sun.rise ? prevSet : sun.set, to = isDay ? sun.set : ms < sun.rise ? sun.rise : nextRise;
  const t = Math.max(0, Math.min(1, (ms - from) / (to - from))), x = 30 + t * 330, y = 262 - Math.sin(t * Math.PI) * 132;
  document.getElementById('body').innerHTML = isDay
    ? `<circle class="halo" cx="${x}" cy="${y}" r="58" fill="url(#sunG)"/><circle cx="${x}" cy="${y}" r="20" fill="#fff6c9"/>`

  document.getElementById('stars').style.opacity = Math.max(0, Math.min(1, -alt / 8));
  document.getElementById('clouds').style.opacity = Math.max(0, Math.min(.5, alt / 20 + .08));

}
function buildScene() {

addEventListener('scroll', () => { const y = Math.min(90, scrollY) ; ['h0', 'h1', 'h2', 'h3'].forEach((id, i) => { document.getElementById(id).style.transform = `translateY(${-y * (i + 1) * .05}px)`; }); }, { passive: true });

/* ---------- Данные ---------- */
async function call(body) {
  if (demo) return { ok: true, dash: demoData(body) };
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, initData: tg.initData }) });
  return res.json();
}
async function load() {

  try {
    const r = await call({ action: 'dash' });
    if (!r.ok) return fail('Нет доступа к данным. Откройте панель из своего бота.');
    dash = r.dash; dash.goals = dash.goals || []; selDay = selDay || iso(NOW()); render();
  } catch (e) { fail('Не удалось загрузить данные. Проверьте интернет и попробуйте снова.', true); }
}
function fail(msg, retry) {

  document.getElementById('app').innerHTML = `<div class="top home"></div><div class="sheet"><div class="grip"></div><div class="card empty">${esc(msg)}${retry ? '<p style="margin-top:10px"><button class="pill on" onclick="location.reload()">Повторить</button></p>' : ''}</div></div>`;
}

/* ---------- Общие части ---------- */
const dayEvents = d => dash.events.filter(x => iso(x.start) === d).sort((a, b) => (b.allDay - a.allDay) || a.start - b.start);
const daysLeft = due => Math.round((dayMs(due) - dayMs(iso(NOW()))) / 864e5);
const dateText = d => fmt(dayMs(d), { day: 'numeric', month: 'long' });
function dueTag(due) {
  const n = daysLeft(due), cls = n < 0 ? 'bad' : n <= 3 ? 'warn' : '';
  const text = n < 0 ? 'просрочено' : n === 0 ? 'сегодня' : n === 1 ? 'завтра' : `через ${n} дн.`;
  return `<span class="due ${cls}">${dateText(due)}, ${text}</span>`;
}
function until(ms) {
  const m = Math.round((ms - NOW()) / 6e4);
  return m < 60 ? `через ${m} мин` : `через ${Math.floor(m / 60)} ч ${m % 60 ? m % 60 + ' мин' : ''}`.trim();
}
const shell = (head, body, home) => `<div class="top ${home ? 'home' : ''}">${head}</div><div class="sheet"><div class="grip"></div>${body}</div>`;
const title = (a, b) => `<h1>${esc(a)}</h1>${b ? `<p>${esc(b)}</p>` : ''}`;

/* ---------- Сегодня ---------- */
function dial(list) {
  const S = 236, c = S / 2, r = 94, now = NOW();
  const pt = (h, rr) => { const a = h / 24 * 2 * Math.PI - Math.PI / 2; return [c + rr * Math.cos(a), c + rr * Math.sin(a)]; };
  const arc = (a, b, col, w, i, faint) => {
    const p = pt(a, r), q = pt(Math.max(a + .15, b), r), big = b - a > 12 ? 1 : 0;
    return `<path class="${faint ? '' : 'arc'}" ${faint ? 'fill="none" stroke-linecap="round"' : ''} pathLength="1" d="M${p[0]} ${p[1]} A${r} ${r} 0 ${big} 1 ${q[0]} ${q[1]}" stroke="${col}" stroke-width="${w}" style="animation-delay:${i * 90}ms"/>`;
  };
  const sun = sunTimes(now), d = pt(hourOf(now), r);
  const labels = [0, 6, 12, 18].map(h => { const q = pt(h, r + 19); return `<text class="lab num" x="${q[0]}" y="${q[1] + 3.5}" text-anchor="middle">${h}</text>`; }).join('');
  const left = list.filter(x => x.end > now).length;
  return `<div class="dial"><svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img" aria-label="Кольцо суток с событиями дня">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="12"/>
    ${arc(hourOf(sun.rise), hourOf(sun.set), 'rgba(255,214,120,.26)', 12, 0, true)}
    ${list.map((x, i) => arc(hourOf(x.start), hourOf(x.end), `var(--${COL[x.cal] || 'todo'})`, 12, i + 1)).join('')}
    <circle cx="${d[0]}" cy="${d[1]}" r="7" fill="#fff" stroke="rgba(0,0,0,.45)" stroke-width="2"/>${labels}</svg>
    <div class="c"><b class="num">${left}</b><span>${left === 1 ? 'дело' : left > 1 && left < 5 ? 'дела' : 'дел'} впереди</span></div></div>
    <div class="legend">${Object.keys(COL).map(k => `<span style="--c:var(--${COL[k]})"><i></i>${NAMES[k]}</span>`).join('')}</div>`;
}
function viewToday() {
  const ms = NOW(), d = iso(ms), list = dayEvents(d).filter(x => !x.allDay);
  const next = list.find(x => x.start > ms), cur = list.find(x => x.start <= ms && x.end > ms);
  const hDone = dash.habits.filter(h => h.today).length, hAll = dash.habits.length;
  const soon = dash.tasks.filter(t => t.due && daysLeft(t.due) <= 7).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 3);
  const goal = dash.goals.find(g => g.due) || dash.goals[0];
  const glass = cur ? `<small>Сейчас, до ${hm(cur.end)}</small><b>${esc(cur.title)}</b>` : next ? `<small>${until(next.start)}, в ${hm(next.start)}</small><b>${esc(next.title)}</b>` : `<small>${list.length ? 'На сегодня всё' : 'Сегодня свободно'}</small><b>Можно отдохнуть</b>`;
  return shell(`<div><div class="clock num">${hm(ms)}</div><div class="date">${esc(fmt(ms, { weekday: 'long', day: 'numeric', month: 'long' }))}</div></div><div class="glass">${glass}</div>`,
    `<div class="card">${dial(list)}</div>
    <div class="tiles">
      <button class="tile" data-tab="mode"><b class="num">${hDone}/${hAll}</b><span>Привычки</span></button>
      <button class="tile" data-tab="mode"><b class="num">${dash.gym.week}/${dash.gym.goal}</b><span>Зал</span></button>

    ${soon.length ? `<div class="card">${soon.map(t => `<div class="row"><span>${esc(t.title)}</span><span class="v">${dueTag(t.due)}</span></div>`).join('')}</div>` : ''}`, true);
}

/* ---------- День: небо как шкала времени ---------- */
function ribbon(d) {
  const PX = 44, from = 6, to = 24, H = (to - from) * PX, base = Date.parse(d + 'T00:00:00+03:00'), sun = sunTimes(base + 432e5);
  const y = h => (h - from) * PX, stops = [];
  for (let h = from; h <= to; h += .5) stops.push(`${skyAt(base + h * 36e5, sun)[1]} ${((h - from) / (to - from) * 100).toFixed(1)}%`);
  let hrs = '';
  for (let h = 8; h <= 22; h += 2) hrs += `<div class="hr num" style="top:${y(h)}px">${h}</div><div class="hl" style="top:${y(h)}px"></div>`;
  const list = dayEvents(d).filter(x => !x.allDay);
  let gaps = '', cursor = Math.max(8, d === iso(NOW()) ? hourOf(NOW()) : 8);
  list.concat([{ start: base + 22 * 36e5, end: base + 22 * 36e5, gap: true }]).forEach(x => {
    const a = hourOf(x.start) || 24;
    if (a - cursor >= 1) { const n = a - cursor; gaps += `<div class="free" style="top:${y(cursor)}px;height:${n * PX}px">свободно ${Math.floor(n)} ч${n % 1 >= .25 ? ' ' + Math.round(n % 1 * 60) + ' мин' : ''}</div>`; }
    if (!x.gap) cursor = Math.max(cursor, hourOf(x.end) || 24);
  });
  const chips = list.map((x, i) => {
    const a = hourOf(x.start), b = hourOf(x.end) || 24, h = Math.max(34, (b - a) * PX - 3);
    return `<div class="chip" style="top:${y(a)}px;height:${h}px;--c:var(--${COL[x.cal] || 'todo'});animation-delay:${i * 40}ms" data-tip="${esc(hm(x.start) + '–' + hm(x.end) + ' ' + x.title + (x.place ? ', ' + x.place : ''))}"><b>${esc(x.title)}</b><span class="num">${hm(x.start)}–${hm(x.end)}</span></div>`;
  }).join('');
  const nowH = hourOf(NOW()), now = d === iso(NOW()) && nowH >= from ? `<div class="now" style="top:${y(nowH)}px"><span class="num">${hm(NOW())}</span></div>` : '';
  return `<div class="ribbon" style="height:${H}px;background:linear-gradient(180deg,${stops.join(',')})">${hrs}${gaps}${chips}${now}</div>`;
}
function viewDay() {
  const start = iso(NOW()), days = [...Array(7)].map((_, i) => shift(start, i)), sel = days.includes(selDay) ? selDay : start, sun = sunTimes(dayMs(sel));
  const all = dayEvents(sel).filter(x => x.allDay);
  return shell(title(fmt(dayMs(sel), { weekday: 'long' }).replace(/^./, c => c.toUpperCase()), dateText(sel) + `, солнце ${hm(sun.rise)}–${hm(sun.set)}`),
    `<div class="strip">${days.map(d => `<button class="${d === sel ? 'on' : ''} ${dayEvents(d).length ? 'has' : ''}" data-sel="${d}">${esc(fmt(dayMs(d), { weekday: 'short' }))}<b class="num">${+d.slice(8)}</b><em></em></button>`).join('')}</div>
    ${all.map(x => `<div class="allday">${esc(x.title)}</div>`).join('')}${ribbon(sel)}`);
}

/* ---------- Цели ---------- */
function viewGoals() {
  const g = dash.goals;
  return shell(title('Цели', g.length ? 'То, к чему вы идёте' : ''),
    g.length ? g.map(x => {
      const left = x.due ? daysLeft(x.due) : null, next = x.steps.filter(s => !s.done).slice(0, 3);
      return `<div class="card goal"><div class="t">${esc(x.title)}</div><div class="s">${x.metric ? esc(x.metric) : ''}</div>
      <div class="bar"><i style="width:${x.progress}%"></i></div><div class="pct"><span class="num">${x.progress}%</span><span>${x.due ? dateText(x.due) + (left >= 0 ? `, ${left} дн.` : '') : 'без срока'}</span></div>
      ${next.map(s => `<div class="step"><button class="box" data-step="${s.row}" aria-label="Отметить: ${esc(s.title)}">${CHECK}</button><span>${esc(s.title)}</span><span class="d">${s.date ? dateText(s.date) : ''}</span></div>`).join('')}</div>`;
    }).join('') : '<div class="card empty">Напишите боту:<br>цель сдать IELTS на 6.5 до июля</div>');

/* ---------- Задачи ---------- */
function viewTasks() {

}

/* ---------- Режим: привычки и зал ---------- */
function lineChart(s) {
  const W = 326, H = 160, L = 28, R = 26, T = 14, B = 22, pts = s.points.slice(-12);
  const vals = pts.map(p => p.w), lo = Math.min(...vals), hi = Math.max(...vals), pad = Math.max(2, (hi - lo) * .2);
  const a = lo - pad, b = hi + pad, x = i => L + (pts.length > 1 ? i / (pts.length - 1) : .5) * (W - L - R), y = v => T + (1 - (v - a) / (b - a)) * (H - T - B);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.w).toFixed(1)).join('');
  const lines = [a + (b - a) * .15, (a + b) / 2, a + (b - a) * .85].map(v => `<line class="grid" x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}"/><text class="lab num" x="0" y="${y(v) + 3}">${Math.round(v)}</text>`).join('');
  const dates = [0, pts.length - 1].filter((v, i, l) => l.indexOf(v) === i).map(i => `<text class="lab" x="${x(i)}" y="${H - 5}" text-anchor="${i ? 'end' : 'start'}">${esc(fmt(dayMs(pts[i].d), { day: 'numeric', month: 'short' }))}</text>`).join('');
  const dots = pts.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.w)}" r="4.5" style="animation-delay:${.8 + i * .03}s"/><rect class="hit" x="${x(i) - 16}" y="0" width="32" height="${H}" data-tip="${esc(dateText(p.d))}: ${p.w} кг"/>`).join('');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(s.name)}: рабочий вес по датам">${lines}${dates}<path class="line" pathLength="1" d="${path}"/>${dots}<text class="val num" x="${x(pts.length - 1)}" y="${y(last.w) - 10}" text-anchor="end">${last.w} кг</text></svg>`;
}
function viewMode() {
  const today = iso(NOW()), h = dash.habits, g = dash.gym, s = g.series[selEx] || g.series[0];
  const habits = h.length ? h.map(x => `<div class="habit"><div><b>${esc(x.name)}</b><span class="hint">${x.streak ? 'Серия: ' + x.streak : 'Серии пока нет'}</span></div>
    <div class="cells" aria-label="Последние 5 недель">${[...Array(35)].map((_, i) => { const d = shift(today, i - 34), on = x.days.includes(d); return `<i class="${on ? 'on' : ''} ${d === today ? 'today' : ''}" data-tip="${esc(dateText(d))}: ${on ? 'сделано' : 'нет'}" style="animation-delay:${i * 7}ms"></i>`; }).join('')}</div>
    <button class="box ${x.today ? 'on' : ''}" data-habit="${x.index}" aria-label="Отметить: ${esc(x.name)}" aria-pressed="${x.today}">${CHECK}</button></div>`).join('') : '<div class="empty">Напишите боту:<br>добавь привычку читать 20 минут</div>';
  return shell(title('Режим', `Зал на этой неделе: ${g.week} из ${g.goal}`),
    `<div class="sec">Привычки</div><div class="card">${habits}</div>
    <div class="sec">Зал</div>
    ${s ? `<div class="card"><div class="chips">${g.series.map((e, i) => `<button class="pill ${e === s ? 'on' : ''}" data-ex="${i}">${esc(e.name)}</button>`).join('')}</div>${lineChart(s)}</div>` : '<div class="card empty">После тренировки напишите боту:<br>жим 60 на 8, присед 80 3 по 5</div>'}
    ${g.records.length ? `<div class="card">${g.records.map(r => `<div class="row"><span>${esc(r.name)}</span><span class="v num">${r.weight} кг</span></div>`).join('')}</div>` : ''}`);
}

/* ---------- Отрисовка и действия ---------- */
const VIEWS = { today: viewToday, day: viewDay, goals: viewGoals, tasks: viewTasks, mode: viewMode };
function render() {
  const boot = document.getElementById('boot'), app = document.getElementById('app'), key = tab + selDay + selEx;
  if (boot) boot.remove();
  app.classList.toggle('still', key === render.key);
  render.key = key;
  app.innerHTML = VIEWS[tab]();
  renderNav();
}
function renderNav() {
  const i = TABS.findIndex(t => t[0] === tab), nav = document.getElementById('nav');
  nav.innerHTML = `<span id="pill" style="transform:translateX(${pillAt * 100}%)"></span>` + TABS.map(t => `<button class="${t[0] === tab ? 'on' : ''}" data-tab="${t[0]}" aria-current="${t[0] === tab}"><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</button>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => { const p = document.getElementById('pill'); if (p) p.style.transform = `translateX(${i * 100}%)`; }));
  pillAt = i;
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.getElementById('confetti'), w = innerWidth, cols = ['#3987e5', '#d95926', '#1baf7a', '#eda100'];
  box.setAttribute('viewBox', `0 0 ${w} ${innerHeight}`);
  for (let i = 0; i < 44; i++) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('width', 6 + Math.random() * 5); r.setAttribute('height', 10); r.setAttribute('rx', 2); r.setAttribute('fill', cols[i % 4]);
    box.appendChild(r);
    const x = w / 2 + (Math.random() - .5) * 60, dx = (Math.random() - .5) * w * 1.1;
    r.animate([{ transform: `translate(${x}px,${innerHeight * .45}px) rotate(0)`, opacity: 1 }, { transform: `translate(${x + dx}px,${innerHeight * (.1 + Math.random() * .9)}px) rotate(${Math.random() * 900}deg)`, opacity: 0 }], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'forwards' }).onfinish = () => r.remove();

const saved = r => { if (r && r.ok) { dash = r.dash; dash.goals = dash.goals || []; return true; } toast('Не сохранилось, попробуйте ещё раз'); return false; };
async function toggleHabit(i, btn) {
  const h = dash.habits.find(x => x.index === i), today = iso(NOW()), next = !h.today;
  h.today = next; h.days = next ? h.days.concat(today) : h.days.filter(d => d !== today); h.streak += next ? 1 : -1;
  btn.classList.toggle('on', next); haptic(next ? 'medium' : 'light');
  if (next && dash.habits.every(x => x.today)) { confetti(); try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} }
  setTimeout(render, 420);
  if (saved(await call({ action: 'habit', name: h.name, done: next }).catch(() => null)) && tab === 'mode') render();
}
async function closeTask(row) {
  document.getElementById('task' + row).classList.add('gone'); haptic('medium');
  dash.tasks = dash.tasks.filter(t => t.row !== row);
  setTimeout(() => { if (!dash.tasks.length) { confetti(); render(); } }, 500);
  saved(await call({ action: 'task', row }).catch(() => null));
}
async function closeStep(row, btn) {
  btn.classList.add('on'); haptic('medium'); confetti();
  dash.goals.forEach(g => g.steps.forEach(s => { if (s.row === row) s.done = true; }));
  setTimeout(render, 520);
  if (saved(await call({ action: 'step', row, done: true }).catch(() => null)) && tab === 'goals') render();
}
function toast(text) { const t = document.getElementById('tip'); t.textContent = text; t.style.left = '16px'; t.style.bottom = '100px'; t.style.top = 'auto'; t.style.opacity = 1; setTimeout(() => { t.style.opacity = 0; }, 2400); }
function showTip(el) {
  const t = document.getElementById('tip'), b = el.getBoundingClientRect();
  t.textContent = el.dataset.tip; t.style.bottom = 'auto'; t.style.opacity = 1;
  t.style.left = Math.min(innerWidth - 238, Math.max(8, b.left)) + 'px'; t.style.top = Math.max(8, b.top - 42) + 'px';
  clearTimeout(showTip.t); showTip.t = setTimeout(() => { t.style.opacity = 0; }, 2200);
}
document.addEventListener('click', e => {
  const q = s => e.target.closest(s); let el;
  if ((el = q('[data-habit]'))) return toggleHabit(+el.dataset.habit, el);
  if ((el = q('[data-task]'))) return closeTask(+el.dataset.task);
  if ((el = q('[data-step]'))) return closeStep(+el.dataset.step, el);
  if ((el = q('[data-tab]'))) { tab = el.dataset.tab; haptic(); scrollTo(0, 0); render(); return; }
  if ((el = q('[data-sel]'))) { selDay = el.dataset.sel; haptic(); render(); return; }
  if ((el = q('[data-ex]'))) { selEx = +el.dataset.ex; haptic(); render(); return; }
  if ((el = q('[data-tip]'))) showTip(el);
});
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el); });

/* ---------- Запуск ---------- */
function theme() { document.documentElement.dataset.theme = qs.get('theme') || (tg && tg.colorScheme) || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes(); } catch (e) {}
  tg.onEvent && tg.onEvent('themeChanged', theme);
}
theme(); buildScene(); paintSky(); renderNav();
setInterval(() => { paintSky(); if (dash && tab === 'today') { const c = document.querySelector('.clock'); if (c) c.textContent = hm(NOW()); } }, 30000);
