<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg: #0e1016; --card: #171a22; --card-2: #1f232d; --line: #2a2f3b;
  --ink: #f0efec; --ink-2: #b9bcc6; --ink-3: #868b99;
  --pairs: #3987e5; --gym: #d95926; --study: #199e70; --todo: #c98500;
  --hue: #199e70; --hue-off: #262b36;
  --good: #1baf7a; --warn: #eda100; --bad: #e66767;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f4f1; --card: #fcfcfb; --card-2: #eeeeea; --line: #e0e0da;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #6f6e69;
  --pairs: #2a78d6; --gym: #eb6834; --study: #1baf7a; --todo: #eda100;
  --hue: #1baf7a; --hue-off: #e4e4de;
  --good: #0f8a5f; --warn: #a86f00; --bad: #c93534;
  --shadow: 0 8px 24px rgba(30, 30, 20, .08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: max(14px, env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
  min-height: 100vh; overflow-x: hidden; user-select: none;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* Фон */
.aurora { position: fixed; inset: -20% -20% auto; height: 60vh; z-index: -1; opacity: .5; pointer-events: none; filter: blur(60px); }
.aurora i { position: absolute; width: 46vw; height: 46vw; border-radius: 50%; animation: drift 16s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { left: 12%; top: 18%; background: var(--pairs); opacity: .35; }
.aurora i:nth-child(2) { left: 52%; top: 8%; background: var(--study); opacity: .3; animation-delay: -6s; }
.aurora i:nth-child(3) { left: 34%; top: 40%; background: var(--gym); opacity: .22; animation-delay: -11s; }
@keyframes drift { to { transform: translate(6vw, 5vh) scale(1.15); } }

/* Карточки */
.card { background: linear-gradient(170deg, color-mix(in srgb, var(--card) 90%, #fff 10%), var(--card) 45%); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.view > * { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
.view > *:nth-child(2) { animation-delay: .05s; } .view > *:nth-child(3) { animation-delay: .1s; }
.view > *:nth-child(4) { animation-delay: .15s; } .view > *:nth-child(5) { animation-delay: .2s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.title { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; font-weight: 600; }
.head { margin: 2px 2px 14px; }
.head h1 { font-size: 26px; line-height: 1.15; font-weight: 750; letter-spacing: -.02em; }
.head p { color: var(--ink-2); margin-top: 2px; }

/* Кольца */
.hero { display: flex; align-items: center; gap: 16px; }
.ring { position: relative; flex: none; }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--hue-off); }
.ring .bar { stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2, .8, .2, 1); transform: rotate(-90deg); transform-origin: center; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--glow) 55%, transparent)); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
.hero .big { font-size: 17px; font-weight: 650; line-height: 1.25; }
.hero .sub { color: var(--ink-2); font-size: 13px; margin-top: 3px; }

/* Таймлайн */
.tl { position: relative; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: var(--line); transform-origin: top; animation: grow .8s ease both; }
@keyframes grow { from { transform: scaleY(0); } }
.ev { position: relative; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .dot { position: absolute; left: -26px; top: 13px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--c); }
.ev .dot svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ev.past { opacity: .5; }
.ev.now .dot { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
.ev .t { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.ev .n { font-weight: 600; line-height: 1.3; }
.ev .p { font-size: 13px; color: var(--ink-3); margin-top: 1px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); margin-right: 12px; }
.tag i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend { display: flex; flex-wrap: wrap; row-gap: 4px; margin-bottom: 10px; }

/* Неделя */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.days button { padding: 6px 0; border-radius: 12px; text-align: center; color: var(--ink-2); font-size: 12px; transition: background .2s, color .2s; }
.days button b { display: block; font-size: 16px; color: var(--ink); font-weight: 650; }
.days button.on { background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); }
.blk { transform-box: fill-box; transform-origin: top; animation: blk .55s cubic-bezier(.2, .8, .2, 1) both; cursor: pointer; }
@keyframes blk { from { transform: scaleY(0); opacity: 0; } }
.grid { stroke: var(--line); stroke-width: 1; }
.lab { fill: var(--ink-3); font-size: 10px; }
.nowline { stroke: var(--bad); stroke-width: 2; stroke-dasharray: 4 3; }

/* Привычки */
.habit { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; }
.habit + .habit { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.habit .nm { font-weight: 650; }
.habit .st { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); }
.flame { width: 14px; height: 14px; fill: var(--gym); animation: flick 1.4s ease-in-out infinite alternate; transform-origin: bottom; }
@keyframes flick { to { transform: scaleY(1.14) scaleX(.94); } }
.tick { width: 42px; height: 42px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); display: grid; place-items: center; transition: background .25s, transform .15s; }
.tick:active { transform: scale(.9); }
.tick svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tick path { stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset .35s ease; }
.tick.on { background: var(--hue); border-color: transparent; }
.tick.on path { stroke-dashoffset: 0; }
.cells { display: grid; grid-template-columns: repeat(7, 12px); gap: 3px; }
.cells i { aspect-ratio: 1; border-radius: 3.5px; background: var(--hue-off); animation: pop .3s ease both; }
.cells i.on { background: linear-gradient(135deg, var(--hue), color-mix(in srgb, var(--hue) 70%, #fff)); }
.cells i.today { outline: 1.5px solid var(--ink-2); outline-offset: 1px; }
@keyframes pop { from { transform: scale(0); } }

/* Зал */
.chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); font-size: 13px; transition: background .2s, color .2s; }
.chip.on { background: var(--ink); color: var(--bg); }
.line { fill: none; stroke: var(--gym); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.pt { fill: var(--gym); stroke: var(--card); stroke-width: 2; animation: pop .3s ease both; transform-box: fill-box; transform-origin: center; }
.hit { fill: transparent; cursor: pointer; }
.valtxt { fill: var(--ink); font-size: 12px; font-weight: 650; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row span:last-child { color: var(--ink-2); flex: none; }

/* Задачи */
.task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); transition: opacity .35s, transform .35s, max-height .35s .1s, padding .35s .1s; max-height: 140px; overflow: hidden; }
.task:last-child { border-bottom: 0; }
.task.gone { opacity: 0; transform: translateX(40px); max-height: 0; padding: 0; }
.box { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--ink-3); flex: none; display: grid; place-items: center; margin-top: 1px; }
.box svg { width: 16px; height: 16px; fill: none; stroke: var(--good); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.box path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .25s; }
.task.gone .box path { stroke-dashoffset: 0; }
.due { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; margin-top: 2px; color: var(--ink-2); }
.due.warn { color: var(--warn); } .due.bad { color: var(--bad); }
.due svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Навигация */
nav { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 22px; background: color-mix(in srgb, var(--card) 80%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); box-shadow: var(--shadow); }
nav #pill { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 5); border-radius: 16px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); transition: transform .32s cubic-bezier(.3, 1.3, .5, 1); }
nav button { position: relative; display: grid; justify-items: center; gap: 2px; padding: 7px 0 5px; font-size: 11px; color: var(--ink-3); border-radius: 16px; transition: color .2s; }
nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
nav button.on { color: var(--ink); }
nav button.on svg { transform: translateY(-1px) scale(1.1); }

/* Небо */
.sky { position: relative; overflow: hidden; border-radius: 26px; padding: 20px 18px 16px; margin-bottom: 12px; color: #fff; min-height: 214px; display: flex; flex-direction: column; box-shadow: var(--shadow); isolation: isolate; }
.sky > svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.sky h1 { font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; text-shadow: 0 2px 14px rgba(0, 0, 0, .35); }
.sky p { font-size: 14px; opacity: .92; margin-top: 3px; text-shadow: 0 1px 8px rgba(0, 0, 0, .4); }
.glass { margin-top: auto; padding: 11px 13px; border-radius: 16px; background: rgba(10, 14, 28, .34); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, .16); }
.glass b { display: block; font-size: 15px; font-weight: 650; line-height: 1.25; }
.glass span { font-size: 13px; opacity: .9; }
.star { fill: #fff; animation: twinkle 3s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }
.sunglow { animation: breathe 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes breathe { to { transform: scale(1.18); opacity: .75; } }
.cloud { fill: rgba(255, 255, 255, .55); animation: float 26s linear infinite alternate; }
@keyframes float { to { transform: translateX(46px); } }
.arc { fill: none; stroke: rgba(255, 255, 255, .35); stroke-width: 1.5; stroke-dasharray: 3 6; }

/* Плитки */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.tile { display: grid; justify-items: center; gap: 6px; padding: 12px 6px; text-align: center; background: linear-gradient(160deg, color-mix(in srgb, var(--card) 88%, #fff 12%), var(--card)); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); font-size: 12px; color: var(--ink-2); transition: transform .15s; }
.tile:active { transform: scale(.96); }
.ring.small circle { stroke-width: 7; }
.ring.small b { font-size: 13px; }
.prog { height: 5px; border-radius: 3px; background: var(--hue-off); margin-top: 7px; overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 3px; background: var(--c); animation: slide .9s ease both; transform-origin: left; }
@keyframes slide { from { transform: scaleX(0); } }

/* Служебное */
.skeleton { height: 110px; border-radius: 20px; margin-bottom: 12px; background: linear-gradient(100deg, var(--card) 30%, var(--card-2) 50%, var(--card) 70%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.empty { text-align: center; color: var(--ink-2); padding: 18px 8px; }
.empty svg { width: 46px; height: 46px; margin: 0 auto 8px; stroke: var(--ink-3); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#tip { position: fixed; z-index: 20; max-width: 220px; padding: 7px 10px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.3; pointer-events: none; opacity: 0; transition: opacity .15s; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="g-study" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3b4"/><stop offset="1" stop-color="#1baf7a"/></linearGradient>
  <linearGradient id="g-gym" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#eb6834"/></linearGradient>
  <linearGradient id="g-pairs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fc1ff"/><stop offset="1" stop-color="#3987e5"/></linearGradient>
</defs></svg>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<main id="app"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="height:200px"></div></main>
<nav id="nav" aria-label="Разделы"></nav>
<div id="tip" role="status"></div>
<svg id="confetti" aria-hidden="true"></svg>

<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbyX2ebkofpr7zYKAuW8E8ocerWxyxAXyTNbvrtbhtxTHpqK6Tk4OKRT2SuoH3iAoJ8ILQ/exec?api=1';
const TZ = 'Europe/Moscow';
const tg = window.Telegram && window.Telegram.WebApp;
const demo = new URLSearchParams(location.search).has('demo');
const COL = { 'Пары': 'pairs', 'Зал': 'gym', 'Учёба дома': 'study', 'Дела': 'todo' };
const NAMES = { 'Пары': 'Пары', 'Зал': 'Зал', 'Учёба дома': 'Учёба', 'Дела': 'Дела' };
const ICON = {
  'Пары': '<path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 12v5c3 2 7 2 10 0v-5"/>',
  'Зал': '<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
  'Учёба дома': '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  'Дела': '<path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>'
};
const TABS = [
  ['today', 'Сегодня', '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'],
  ['week', 'Неделя', '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ['habits', 'Привычки', '<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>'],
  ['gym', 'Зал', ICON['Зал']],
  ['tasks', 'Задачи', '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/>']
];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (ms, o) => new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, ...o }).format(ms);
const hm = ms => fmt(ms, { hour: '2-digit', minute: '2-digit' });
const iso = ms => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms);
const dayMs = d => Date.parse(d + 'T12:00:00+03:00');
const shift = (d, n) => iso(dayMs(d) + n * 864e5);
const haptic = t => { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
let dash = null, tab = 'today', selDay = null, selEx = 0;

/* ---------- Данные ---------- */
async function call(body) {
  if (demo) return { ok: true, dash: demoData(body) };
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, initData: tg.initData }) });
  return res.json();
}
async function load() {
  if (!demo && !(tg && tg.initData)) return fail('Откройте панель из бота в Telegram.');
  try {
    const r = await call({ action: 'dash' });
    if (!r.ok) return fail('Нет доступа к данным. Откройте панель из своего бота.');
    dash = r.dash; selDay = selDay || iso(Date.now()); render();
  } catch (e) { fail('Не удалось загрузить данные. Проверьте интернет и попробуйте снова.', true); }
}
function fail(msg, retry) {
  document.getElementById('app').innerHTML = '<div class="card empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.1"/></svg>' + esc(msg) + (retry ? '<p style="margin-top:10px"><button class="chip on" onclick="load()">Повторить</button></p>' : '') + '</div>';
}

/* ---------- Общие части ---------- */
function ring(size, value, label, color) {
  const small = size < 70, stroke = small ? 7 : 10, r = (size - stroke) / 2, c = 2 * Math.PI * r, id = 'r' + Math.random().toString(36).slice(2);
  requestAnimationFrame(() => requestAnimationFrame(() => { const el = document.getElementById(id); if (el) el.style.strokeDashoffset = c * (1 - Math.min(1, value)); }));
  return `<div class="ring ${small ? 'small' : ''}" style="width:${size}px;height:${size}px;--glow:var(--${color === 'study' ? 'study' : color})"><svg width="${size}" height="${size}" role="img" aria-label="${esc(label)}"><circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}"/><circle id="${id}" class="bar" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="url(#g-${color})" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg><b class="num">${esc(label)}</b></div>`;
}
/* Небо по времени суток: солнце и луна идут по дуге в реальном времени */
function skyScene() {
  const p = fmt(Date.now(), { hour: 'numeric', minute: 'numeric', hour12: false }).split(':'), h = +p[0] + +p[1] / 60;
  const night = h < 6 || h >= 21, phase = night ? 'night' : h < 9 ? 'dawn' : h < 17 ? 'day' : 'dusk';
  const sky = { night: ['#0a0f2c', '#1e2a5e', '#3a3f7a'], dawn: ['#3b5bb5', '#e8867a', '#ffc58a'], day: ['#1f6fd6', '#3f97ea', '#8ccbf5'], dusk: ['#2b2a6b', '#a4478a', '#f08a5d'] }[phase];
  const t = night ? ((h - 21 + 24) % 24) / 9 : (h - 6) / 15;
  const P0 = [24, 150], P1 = [175, -44], P2 = [326, 150];
  const q = (a, b, c) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c, x = q(P0[0], P1[0], P2[0]), y = q(P0[1], P1[1], P2[1]);
  const stars = night || phase === 'dusk' ? [[34, 26], [70, 58], [112, 20], [150, 44], [204, 18], [246, 52], [292, 24], [322, 62], [262, 88], [92, 92], [188, 76]].map((s, i) => `<circle class="star" cx="${s[0]}" cy="${s[1]}" r="${1 + (i % 3) * .5}" style="animation-delay:${i * .37}s"/>`).join('') : '';
  const body = night
    ? `<circle class="sunglow" cx="${x}" cy="${y}" r="26" fill="url(#moonGlow)"/><circle cx="${x}" cy="${y}" r="12" fill="#f2f0dc"/><circle cx="${x + 5}" cy="${y - 3}" r="10" fill="${sky[1]}"/>`
    : `<circle class="sunglow" cx="${x}" cy="${y}" r="40" fill="url(#sunGlow)"/><circle cx="${x}" cy="${y}" r="13" fill="#fff6c9"/>`;
  const clouds = phase === 'day' || phase === 'dawn' ? '<g class="cloud"><ellipse cx="70" cy="46" rx="26" ry="8"/><ellipse cx="86" cy="40" rx="16" ry="9"/></g><g class="cloud" style="animation-duration:38s"><ellipse cx="238" cy="30" rx="22" ry="6"/><ellipse cx="252" cy="25" rx="12" ry="7"/></g>' : '';
  return `<svg viewBox="0 0 350 214" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".65" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/></linearGradient>
    <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff2b0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#dfe3ff" stop-opacity=".6"/><stop offset="1" stop-color="#dfe3ff" stop-opacity="0"/></radialGradient></defs>
    <rect width="350" height="214" fill="url(#skyG)"/>${stars}${clouds}
    <path class="arc" d="M24 150 Q175 -44 326 150"/>${body}
    <path d="M0 186 Q70 156 150 180 T350 168 V214 H0z" fill="rgba(6,10,26,.34)"/><path d="M0 204 Q90 176 190 198 T350 190 V214 H0z" fill="rgba(6,10,26,.5)"/></svg>`;
}
const legend = () => '<div class="legend">' + Object.keys(COL).map(k => `<span class="tag" style="--c:var(--${COL[k]})"><i></i>${NAMES[k]}</span>`).join('') + '</div>';
function eventRow(x) {
  const now = Date.now(), state = x.end < now ? 'past' : x.start <= now ? 'now' : '';
  const done = state === 'now' ? Math.round((now - x.start) / (x.end - x.start) * 100) : 0;
  return `<div class="ev ${state}" style="--c:var(--${COL[x.cal] || 'todo'})"><span class="dot"><svg viewBox="0 0 24 24">${ICON[x.cal] || ICON['Дела']}</svg></span><div class="t num">${x.allDay ? 'весь день' : hm(x.start) + '–' + hm(x.end)} · ${NAMES[x.cal] || x.cal}</div><div class="n">${esc(x.title)}</div>${x.place ? `<div class="p">${esc(x.place)}</div>` : ''}${state === 'now' ? `<div class="prog"><i style="width:${done}%"></i></div>` : ''}</div>`;
}
const dayEvents = d => dash.events.filter(x => iso(x.start) === d).sort((a, b) => (b.allDay - a.allDay) || a.start - b.start);
function until(ms) {
  const m = Math.round((ms - Date.now()) / 6e4);

}
function daysLeft(due) { return Math.round((dayMs(due) - dayMs(iso(Date.now()))) / 864e5); }
function dueTag(due) {
  const n = daysLeft(due), cls = n < 0 ? 'bad' : n <= 3 ? 'warn' : '';
  const text = n < 0 ? 'просрочено' : n === 0 ? 'сегодня' : n === 1 ? 'завтра' : `через ${n} дн.`;
  const when = fmt(dayMs(due), { day: 'numeric', month: 'long' });
  return `<span class="due ${cls}"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>${when}, ${text}</span>`;
}

/* ---------- Сегодня ---------- */
function viewToday() {
  const d = iso(Date.now()), list = dayEvents(d).filter(x => !x.allDay), now = Date.now();
  const next = list.find(x => x.start > now), cur = list.find(x => x.start <= now && x.end > now);
  const total = list.reduce((s, x) => s + (x.end - x.start), 0);
  const past = list.reduce((s, x) => s + Math.max(0, Math.min(now, x.end) - x.start), 0);
  const pct = total ? past / total : 0;
  const greet = +fmt(now, { hour: 'numeric', hour12: false }) < 12 ? 'Доброе утро' : +fmt(now, { hour: 'numeric', hour12: false }) < 18 ? 'Добрый день' : 'Добрый вечер';
  const hDone = dash.habits.filter(h => h.today).length, hAll = dash.habits.length, g = dash.gym;
  const soon = dash.tasks.filter(t => t.due && daysLeft(t.due) <= 7).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 4);
  return `<div class="sky">${skyScene()}<h1>${greet}</h1><p>${esc(fmt(now, { weekday: 'long', day: 'numeric', month: 'long' }))}</p>
    <div class="glass"><b>${cur ? esc(cur.title) : next ? esc(next.title) : list.length ? 'На сегодня всё' : 'Свободный день'}</b>
    <span>${cur ? 'идёт сейчас, до ' + hm(cur.end) : next ? until(next.start) + ', в ' + hm(next.start) : 'Можно отдохнуть'}</span></div></div>
  <div class="tiles">
    <button class="tile" data-tab="week">${ring(58, pct, Math.round(pct * 100) + '%', 'pairs')}День</button>
    <button class="tile" data-tab="habits">${ring(58, hAll ? hDone / hAll : 0, hDone + '/' + hAll, 'study')}Привычки</button>
    <button class="tile" data-tab="gym">${ring(58, g.week / g.goal, g.week + '/' + g.goal, 'gym')}Зал</button>
  </div>
  ${soon.length ? `<div class="card"><div class="title">Сроки</div>${soon.map(t => `<div style="margin-bottom:8px"><div class="n">${esc(t.title)}</div>${dueTag(t.due)}</div>`).join('')}</div>` : ''}
  <div class="card"><div class="title">План дня</div>${list.length ? `<div class="tl">${list.map(eventRow).join('')}</div>` : '<div class="empty">Событий нет</div>'}</div>`;
}

/* ---------- Неделя ---------- */
function viewWeek() {
  const start = iso(Date.now()), days = [...Array(7)].map((_, i) => shift(start, i));
  const W = 350, H = 330, top = 6, left = 24, colW = (W - left) / 7, h0 = 8, h1 = 22;
  const y = ms => { const p = fmt(ms, { hour: 'numeric', minute: 'numeric', hour12: false }).split(':'); return top + ((+p[0] + +p[1] / 60 - h0) / (h1 - h0)) * (H - top - 4); };
  let bars = '', grid = '';
  for (let h = h0; h <= h1; h += 2) { const yy = top + ((h - h0) / (h1 - h0)) * (H - top - 4); grid += `<line class="grid" x1="${left}" x2="${W}" y1="${yy}" y2="${yy}"/><text class="lab num" x="0" y="${yy + 3}">${h}</text>`; }
  days.forEach((d, i) => dayEvents(d).filter(x => !x.allDay).forEach((x, n) => {
    const y1 = Math.max(top, y(x.start)), y2 = Math.max(y1 + 5, y(x.end) - 2);
    bars += `<rect class="blk" data-tip="${esc(hm(x.start) + '–' + hm(x.end) + ' ' + x.title)}" data-day="${d}" x="${left + i * colW + 2}" y="${y1}" width="${colW - 4}" height="${y2 - y1}" rx="4" fill="var(--${COL[x.cal] || 'todo'})" style="animation-delay:${i * 45 + n * 12}ms"/>`;
  }));
  const nowY = y(Date.now()), nowLine = nowY > top && nowY < H ? `<line class="nowline" x1="${left}" x2="${left + colW}" y1="${nowY}" y2="${nowY}"/>` : '';
  const sel = days.includes(selDay) ? selDay : start, list = dayEvents(sel);
  grid = `<rect x="${left + days.indexOf(sel) * colW}" y="${top}" width="${colW}" height="${H - top - 4}" rx="6" fill="var(--card-2)"/>` + grid;
  return `<div class="head"><h1>Неделя</h1><p>Нажмите на день или блок</p></div>
  <div class="card">${legend()}<div class="days">${days.map(d => `<button class="${d === sel ? 'on' : ''}" data-sel="${d}">${esc(fmt(dayMs(d), { weekday: 'short' }))}<b class="num">${+d.slice(8)}</b></button>`).join('')}</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Расписание на семь дней">${grid}${bars}${nowLine}</svg></div>
  <div class="card"><div class="title">${esc(fmt(dayMs(sel), { weekday: 'long', day: 'numeric', month: 'long' }))}</div>${list.length ? `<div class="tl">${list.map(eventRow).join('')}</div>` : '<div class="empty">Свободный день</div>'}</div>`;
}

/* ---------- Привычки ---------- */
function viewHabits() {
  const today = iso(Date.now()), h = dash.habits;
  if (!h.length) return `<div class="head"><h1>Привычки</h1></div><div class="card empty"><svg viewBox="0 0 24 24">${TABS[2][2]}</svg>Пока пусто.<br>Напишите боту: добавь привычку читать 20 минут</div>`;
  const done = h.filter(x => x.today).length;
  const best = Math.max(...h.map(x => x.streak));
  return `<div class="head"><h1>Привычки</h1><p>Нажмите квадрат, чтобы отметить сегодня</p></div>
  <div class="card hero">${ring(92, done / h.length, done + '/' + h.length, 'study')}<div><div class="big">${done === h.length ? 'Всё выполнено' : 'Осталось ' + (h.length - done)}</div><div class="sub">Лучшая серия сейчас: ${best}</div></div></div>
  <div class="card">${h.map(x => `<div class="habit"><div><div class="nm">${esc(x.name)}</div><span class="st">${x.streak ? `<svg class="flame" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-2 1-4 2-5 0 2 1 3 2 3 1-4 0-6 2-10z"/></svg>Серия: ${x.streak}` : 'Серии пока нет'}</span><div class="st" style="margin-top:2px">${Math.round(x.days.length / 35 * 100)}% за 5 недель</div></div>
    <div class="cells" aria-label="Последние 35 дней">${[...Array(35)].map((_, i) => { const d = shift(today, i - 34); return `<i class="${x.days.includes(d) ? 'on' : ''} ${d === today ? 'today' : ''}" data-tip="${esc(fmt(dayMs(d), { day: 'numeric', month: 'long' }))}: ${x.days.includes(d) ? 'сделано' : 'нет'}" style="animation-delay:${i * 8}ms"></i>`; }).join('')}</div>
    <button class="tick ${x.today ? 'on' : ''}" data-habit="${x.index}" aria-label="Отметить: ${esc(x.name)}" aria-pressed="${x.today}"><svg viewBox="0 0 24 24"><path d="M5 13l4.5 4.5L19 7"/></svg></button></div>`).join('')}</div>`;
}

/* ---------- Зал ---------- */
function lineChart(s) {
  const W = 350, H = 170, L = 30, R = 30, T = 14, B = 22, pts = s.points.slice(-12);
  const vals = pts.map(p => p.w), lo = Math.min(...vals), hi = Math.max(...vals), pad = Math.max(2, (hi - lo) * .2);
  const a = lo - pad, b = hi + pad, x = i => L + (pts.length > 1 ? i / (pts.length - 1) : .5) * (W - L - R), y = v => T + (1 - (v - a) / (b - a)) * (H - T - B);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.w).toFixed(1)).join('');
  const lines = [a + (b - a) * .15, (a + b) / 2, a + (b - a) * .85].map(v => `<line class="grid" x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}"/><text class="lab num" x="0" y="${y(v) + 3}">${Math.round(v)}</text>`).join('');
  const dates = [0, pts.length - 1].filter((v, i, l) => l.indexOf(v) === i).map(i => `<text class="lab" x="${x(i)}" y="${H - 6}" text-anchor="${i ? 'end' : 'start'}">${esc(fmt(dayMs(pts[i].d), { day: 'numeric', month: 'short' }))}</text>`).join('');
  const dots = pts.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.w)}" r="5" style="animation-delay:${.9 + i * .03}s"/><rect class="hit" x="${x(i) - 18}" y="0" width="36" height="${H}" data-tip="${esc(fmt(dayMs(p.d), { day: 'numeric', month: 'long' }))}: ${p.w} кг"/>`).join('');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(s.name)}: рабочий вес по датам">${lines}${dates}<path class="line" pathLength="1" d="${path}"/>${dots}<text class="valtxt num" x="${x(pts.length - 1)}" y="${y(last.w) - 11}" text-anchor="end">${last.w} кг</text></svg>`;
}
function viewGym() {
  const g = dash.gym;
  const s = g.series[selEx] || g.series[0];
  return `<div class="head"><h1>Зал</h1><p>${g.last ? 'Последняя: ' + esc(fmt(dayMs(g.last), { weekday: 'long', day: 'numeric', month: 'long' })) : 'Тренировок пока нет'}</p></div>
  <div class="card hero">${ring(92, g.week / g.goal, g.week + '/' + g.goal, 'gym')}<div><div class="big">${g.week >= g.goal ? 'Цель недели выполнена' : 'Ещё ' + (g.goal - g.week) + ' на этой неделе'}</div><div class="sub">Вт, Чт, Сб, 7:00–8:30</div></div></div>
  ${s ? `<div class="card"><div class="title">Прогресс</div><div class="chips">${g.series.map((e, i) => `<button class="chip ${e === s ? 'on' : ''}" data-ex="${i}">${esc(e.name)}</button>`).join('')}</div>${lineChart(s)}</div>` : `<div class="card empty"><svg viewBox="0 0 24 24">${ICON['Зал']}</svg>После тренировки напишите боту:<br>жим 60 на 8, присед 80 3 по 5</div>`}
  ${g.records.length ? `<div class="card"><div class="title">Рекорды</div>${g.records.map(r => `<div class="row"><span>${esc(r.name)}</span><span class="num">${r.weight} кг</span></div>`).join('')}</div>` : ''}
  ${g.lastSets.length ? `<div class="card"><div class="title">Последняя тренировка</div>${g.lastSets.map(r => `<div class="row"><span>${esc(r.name)}</span><span class="num">${r.text}</span></div>`).join('')}</div>` : ''}`;
}

/* ---------- Задачи ---------- */
function viewTasks() {
  const t = dash.tasks.slice().sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  const mark = { 'высокая': ['bad', 'Важно'], 'низкая': ['', ''] };
  return `<div class="head"><h1>Задачи</h1><p>${t.length ? 'Открыто: ' + t.length : 'Ничего не горит'}</p></div>
  <div class="card">${t.length ? t.map(x => `<div class="task" id="task${x.row}"><button class="box" data-task="${x.row}" aria-label="Закрыть: ${esc(x.title)}"><svg viewBox="0 0 24 24"><path d="M5 13l4.5 4.5L19 7"/></svg></button><div><div class="n">${esc(x.title)}</div>${x.due ? dueTag(x.due) : ''}${x.priority === 'высокая' ? ' <span class="due bad">важно</span>' : ''}${x.minutes ? ` <span class="due">${x.minutes} мин</span>` : ''}</div></div>`).join('') : `<div class="empty"><svg viewBox="0 0 24 24">${TABS[4][2]}</svg>Открытых задач нет</div>`}</div>`;
}

/* ---------- Отрисовка и действия ---------- */
const VIEWS = { today: viewToday, week: viewWeek, habits: viewHabits, gym: viewGym, tasks: viewTasks };
function render() {
  document.getElementById('app').innerHTML = `<div class="view">${VIEWS[tab]()}</div>`;
  renderNav();
}
let pillAt = 0;
function renderNav() {
  const i = TABS.findIndex(t => t[0] === tab), nav = document.getElementById('nav');
  nav.innerHTML = `<span id="pill" style="transform:translateX(${pillAt * 100}%)"></span>` + TABS.map(t => `<button class="${t[0] === tab ? 'on' : ''}" data-tab="${t[0]}" aria-current="${t[0] === tab}"><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</button>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => { const p = document.getElementById('pill'); if (p) p.style.transform = `translateX(${i * 100}%)`; }));
  pillAt = i;
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.getElementById('confetti'), w = innerWidth, cols = ['--pairs', '--gym', '--study', '--todo'];
  box.setAttribute('viewBox', `0 0 ${w} ${innerHeight}`);
  for (let i = 0; i < 44; i++) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('width', 6 + Math.random() * 5); r.setAttribute('height', 10); r.setAttribute('rx', 2);
    r.setAttribute('fill', getComputedStyle(document.documentElement).getPropertyValue(cols[i % 4]));
    box.appendChild(r);
    const x = w / 2 + (Math.random() - .5) * 60, dx = (Math.random() - .5) * w * 1.1;
    r.animate([{ transform: `translate(${x}px,${innerHeight * .45}px) rotate(0)`, opacity: 1 }, { transform: `translate(${x + dx}px,${innerHeight * (.1 + Math.random() * .9)}px) rotate(${Math.random() * 900}deg)`, opacity: 0 }], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'forwards' }).onfinish = () => r.remove();
  }
}
async function toggleHabit(i, btn) {
  const h = dash.habits.find(x => x.index === i), today = iso(Date.now()), next = !h.today;
  h.today = next; h.days = next ? h.days.concat(today) : h.days.filter(d => d !== today); h.streak += next ? 1 : -1;
  btn.classList.toggle('on', next); haptic(next ? 'medium' : 'light');
  if (next && dash.habits.every(x => x.today)) { confetti(); try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} }
  setTimeout(render, 420);
  const r = await call({ action: 'habit', name: h.name, done: next }).catch(() => null);
  if (r && r.ok) { dash = r.dash; if (tab === 'habits') render(); } else toast('Не сохранилось, попробуйте ещё раз');
}
async function closeTask(row) {
  const el = document.getElementById('task' + row);
  haptic('medium'); el.classList.add('gone');
  dash.tasks = dash.tasks.filter(t => t.row !== row);
  setTimeout(() => { if (!dash.tasks.length) { confetti(); render(); } }, 500);
  const r = await call({ action: 'task', row }).catch(() => null);
  if (r && r.ok) dash = r.dash; else toast('Не сохранилось, попробуйте ещё раз');
}
function toast(text) { const t = document.getElementById('tip'); t.textContent = text; t.style.left = '16px'; t.style.bottom = '100px'; t.style.top = 'auto'; t.style.opacity = 1; setTimeout(() => { t.style.opacity = 0; }, 2400); }
function showTip(el, ev) {
  const t = document.getElementById('tip'), box = el.getBoundingClientRect();
  t.textContent = el.dataset.tip; t.style.bottom = 'auto'; t.style.opacity = 1;
  t.style.left = Math.min(innerWidth - 230, Math.max(8, box.left - 40)) + 'px';
  t.style.top = Math.max(8, box.top - 44) + 'px';
  clearTimeout(showTip.t); showTip.t = setTimeout(() => { t.style.opacity = 0; }, 2200);
}
document.addEventListener('click', e => {
  const q = s => e.target.closest(s); let el;
  if ((el = q('[data-tab]'))) { tab = el.dataset.tab; haptic(); scrollTo(0, 0); render(); return; }
  if ((el = q('[data-habit]'))) return toggleHabit(+el.dataset.habit, el);
  if ((el = q('[data-task]'))) return closeTask(+el.dataset.task);
  if ((el = q('[data-sel]'))) { selDay = el.dataset.sel; haptic(); render(); return; }
  if ((el = q('[data-ex]'))) { selEx = +el.dataset.ex; haptic(); render(); return; }
  if ((el = q('[data-tip]'))) { showTip(el, e); if (el.dataset.day && el.dataset.day !== selDay) { selDay = el.dataset.day; setTimeout(render, 1400); } }
});
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el, e); });

/* ---------- Запуск ---------- */
if (tg) {
  tg.ready(); tg.expand();
  if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
  try { tg.setHeaderColor(tg.colorScheme === 'light' ? '#f4f4f1' : '#0e1016'); tg.setBackgroundColor(tg.colorScheme === 'light' ? '#f4f4f1' : '#0e1016'); tg.disableVerticalSwipes(); } catch (e) {}
  tg.onEvent && tg.onEvent('themeChanged', () => { document.documentElement.dataset.theme = tg.colorScheme; });
} else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
const qsTheme = new URLSearchParams(location.search).get('theme');
if (qsTheme) document.documentElement.dataset.theme = qsTheme;
renderNav();

/* ---------- Демо для проверки вне Telegram ---------- */
function demoData(body) {
  if (dash) {
    if (body.action === 'habit') { const h = dash.habits.find(x => x.name === body.name); h.today = body.done; }
    return dash;
  }
  const t = iso(Date.now()), at = (d, s) => Date.parse(d + 'T' + s + ':00+03:00');
  const ev = (d, a, b, cal, title, place) => ({ cal, title, place: place || '', allDay: false, start: at(d, a), end: at(d, b) });
  const events = [];
  for (let i = 0; i < 7; i++) {
    const d = shift(t, i), wd = new Date(dayMs(d)).getUTCDay();
    if ([2, 4, 6].includes(wd)) events.push(ev(d, '07:00', '08:30', 'Зал', 'Зал'));
    if (wd === 1) events.push(ev(d, '08:00', '10:50', 'Пары', 'Английский язык', 'Львовская, 1В'));
    if (wd === 4) events.push(ev(d, '13:00', '14:20', 'Пары', 'Микроэкономика 2 - лекция', 'ауд. 318, Львовская, 1В'), ev(d, '14:40', '16:00', 'Пары', 'Бухгалтерский учет - лекция', 'ауд. 318, Львовская, 1В'));

  }
